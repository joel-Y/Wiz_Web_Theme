<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>WizSmith OG Card Renderer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0B0F19;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #FFFFFF;
      position: relative;
    }

    /* Ambient cyber-physical gradients */
    .glow-blue {
      position: absolute;
      width: 650px;
      height: 650px;
      top: -200px;
      right: -100px;
      background: radial-gradient(circle, rgba(0, 71, 171, 0.45) 0%, rgba(11, 15, 25, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .glow-orange {
      position: absolute;
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -100px;
      background: radial-gradient(circle, rgba(232, 99, 10, 0.28) 0%, rgba(11, 15, 25, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* Subtle grid overlay */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card-container {
      position: relative;
      z-index: 10;
      width: 1200px;
      height: 630px;
      padding: 60px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0047AB 0%, #E8630A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(0, 71, 171, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-accent {
      color: #E8630A;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #94A3B8;
    }

    .badge-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
    }

    /* Content main area */
    .main-content {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 50px;
      align-items: center;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #38BDF8;
    }

    .title {
      font-size: 46px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }

    .title-highlight {
      background: linear-gradient(135deg, #60A5FA 0%, #FFFFFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: 18px;
      line-height: 1.5;
      color: #94A3B8;
      max-width: 580px;
    }

    /* Visual HUD Card on the right */
    .hud-card {
      background: rgba(26, 34, 52, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-title {
      font-size: 15px;
      font-weight: 700;
      color: #F1F5F9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-status {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #10B981;
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .hud-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      font-family: 'JetBrains Mono', monospace;
    }

    .metric-sub {
      font-size: 11px;
      color: #38BDF8;
      margin-top: 2px;
    }

    .hud-banner {
      background: linear-gradient(90deg, rgba(0, 71, 171, 0.25) 0%, rgba(232, 99, 10, 0.2) 100%);
      border: 1px solid rgba(0, 71, 171, 0.35);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    /* Bottom footer */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      color: #64748B;
    }

    .footer-tags {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .footer-tag {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-domain {
      font-family: 'JetBrains Mono', monospace;
      color: #E2E8F0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

    const cardKey = params.get('card') || 'home';
    const data = cardsData[cardKey] || cardsData['home'];

    const container = document.getElementById('cardContainer');
    container.innerHTML = `

</body>
</html>
